[project]
name = "brainrotgpt"
version = "3.0.0"
description = "Telegram bot that is a brainrotted kid (Groq)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    "E501",  # long lines — the persona/prompt strings are intentionally long
    "B008",  # function call in default arg (not used in a risky way here)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
